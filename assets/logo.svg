<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360">
  <defs>
    <linearGradient id="bgBanner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10151f"/>
      <stop offset="100%" stop-color="#05070a"/>
    </linearGradient>
    <linearGradient id="titleFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="10%" stop-color="#ffffff"/>
      <stop offset="120%" stop-color="#ff5b3a"/>
    </linearGradient>
    <linearGradient id="blockOrange2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb08a"/>
      <stop offset="45%" stop-color="#ff5b3a"/>
      <stop offset="100%" stop-color="#a92c17"/>
    </linearGradient>
    <linearGradient id="blockBlue2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bdf1ff"/>
      <stop offset="55%" stop-color="#3ad1ff"/>
      <stop offset="100%" stop-color="#1477a3"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="360" fill="url(#bgBanner)"/>

  <!-- faint scattered voxel texture in the background -->
  <g opacity="0.12">
    <rect x="60" y="40" width="34" height="34" fill="#ff5b3a" transform="rotate(12 77 57)"/>
    <rect x="1040" y="260" width="46" height="46" fill="#3ad1ff" transform="rotate(-18 1063 283)"/>
    <rect x="960" y="40" width="26" height="26" fill="#3ad1ff" transform="rotate(8 973 53)"/>
    <rect x="150" y="270" width="22" height="22" fill="#ffcf4a" transform="rotate(-10 161 281)"/>
    <rect x="1100" y="60" width="30" height="30" fill="#ff5b3a" transform="rotate(20 1115 75)"/>
    <rect x="40" y="250" width="20" height="20" fill="#3ad17a" transform="rotate(-6 50 260)"/>
  </g>

  <!-- icon mark -->
  <g transform="translate(90,80)">
    <rect x="2" y="2" width="196" height="196" rx="40" fill="#151b26" stroke="#3a4658" stroke-width="3" opacity="0.9"/>
    <rect x="86" y="27" width="30" height="50" rx="5" fill="url(#blockOrange2)"/>
    <rect x="86" y="123" width="30" height="50" rx="5" fill="url(#blockOrange2)"/>
    <rect x="27" y="86" width="50" height="30" rx="5" fill="url(#blockOrange2)"/>
    <rect x="123" y="86" width="50" height="30" rx="5" fill="url(#blockOrange2)"/>
    <rect x="86" y="86" width="30" height="30" rx="6" fill="url(#blockBlue2)" transform="rotate(45 101 101)"/>
    <rect x="93" y="93" width="16" height="16" rx="3" fill="#0a0e14" opacity="0.85"/>
  </g>

  <!-- wordmark -->
  <text x="325" y="185" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="80" letter-spacing="2" fill="url(#titleFill)">BLOCK WARFARE</text>
  <text x="328" y="228" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="24" letter-spacing="9" fill="#8a94a6">TACTICAL VOXEL COMBAT</text>
  <text x="328" y="278" font-family="Arial, Helvetica, sans-serif" font-weight="400" font-size="19" letter-spacing="2" fill="#5a6b82">Created by Shayan</text>
</svg>
